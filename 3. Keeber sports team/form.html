<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Css/form.css">
</head>
<body>
    <header class="head">
        <form action="#">
            <div class="form-head">
                <a class="gobacknow" href="./index.html">&#60;</a>
                <h1 class="smallhead">Application for entery</h1>
            </div>
            <div class="form-body">
                <fieldset class="weirdborder">
                    <legend>Your name in real life 7'-'7</legend>
                    <input class="put name" type="text" placeholder="Name">
                    <input class="put lastname" type="text" placeholder="Lastname">
                </fieldset>
                <div class="morw">
                    <p>Your sex</p>
                    <input id="men" type="radio" name="tie" value="men">
                    <label for="men">M</label>
                    <input id="women" type="radio" name="tie" value="women">
                    <label for="women">W</label>
                </div>
                <div>
                    <input id="checkbox" type="checkbox" name="age" value="eighteen">
                    <label for="checkbox">I am 18</label>
                </div>
                <div class="yourgame">
                    <label for="threegames">Your game</label>
                    <select name="Games" id="threegames">
                        <option value="CSGO">CS: GO</option>
                        <option value="Dota">Dota 2</option>
                        <option value="Apex">Apex legends</option>
                    </select>
                </div>
                <textarea class="comment" type="text" name="comment" placeholder="Additional info" ></textarea>
                <button class="shiny">Send Application</button>
            </div>
        </form>
    </header>
</body>
</html>
